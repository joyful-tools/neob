name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Report released packages
        if: startsWith(github.event.head_commit.message, 'Version Packages')
        run: |
          released_packages="$({
            git diff --name-only "$GITHUB_SHA^" "$GITHUB_SHA" -- 'packages/*/package.json' |
              while IFS= read -r package_json; do
                jq --compact-output '{ name, version }' "$package_json"
              done
          })"

          if [[ -z "$released_packages" ]]; then
            exit 0
          fi

          {
            echo "## Released packages"
            echo ""
            echo "| Package | Version | npm | GitHub Packages | GitHub release |"
            echo "| --- | --- | --- | --- | --- |"
            jq --slurp --raw-output --arg repository "$GITHUB_REPOSITORY" '
              .[] |
              .name as $name |
              .version as $version |
              ($name | split("/") | last | @uri) as $github_package |
              ("\($name)@\($version)" | @uri) as $tag |
              "| `\($name)` | `\($version)` | [View](https://www.npmjs.com/package/\($name)/v/\($version)) | [View](https://github.com/\($repository)/pkgs/npm/\($github_package)) | [View](https://github.com/\($repository)/releases/tag/\($tag)) |"
            ' <<< "$released_packages"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Validate release candidate
        run: bun run check

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run changeset:version
          publish: bun run changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Setup GitHub Packages
        if: steps.changesets.outputs.published == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@joyful-tools'
          package-manager-cache: false

      - name: Publish to GitHub Packages
        if: steps.changesets.outputs.published == 'true'
        working-directory: packages/neob-ui
        run: |
          npm pkg set name=@joyful-tools/neob
          npm pkg set publishConfig.registry=https://npm.pkg.github.com
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
