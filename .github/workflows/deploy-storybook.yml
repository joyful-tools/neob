name: Deploy Storybook

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed

concurrency:
  group: deploy-storybook-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy Storybook Preview
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0] != null && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: storybook-preview/pr-${{ github.event.workflow_run.pull_requests[0].number }}
      url: ${{ steps.deploy_preview.outputs.deployment-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Storybook
        run: bun run storybook:build

      - name: Deploy preview
        id: deploy_preview
        working-directory: packages/neob-storybook
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_ALIAS: pr-${{ github.event.workflow_run.pull_requests[0].number }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/storybook-preview.ndjson
        run: |
          : > "$WRANGLER_OUTPUT_FILE_PATH"
          bun run cf workers versions create --prebuilt --preview-alias "$PREVIEW_ALIAS"
          deployment_url=$(jq -ser '
            map(select(.type == "version-upload" and .worker_name == "neob-storybook" and .version_id != null))
            | last
            | (.preview_url // .preview_alias_url)
            | select(type == "string" and startswith("https://"))
          ' "$WRANGLER_OUTPUT_FILE_PATH")
          echo "deployment-url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Add preview summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy_preview.outputs.deployment-url }}
        run: |
          echo "## Storybook Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preview URL: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preview alias: pr-${{ github.event.workflow_run.pull_requests[0].number }}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy Storybook to Cloudflare Workers
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: storybook-production
      url: ${{ steps.deploy_production.outputs.deployment-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Storybook
        run: bun run storybook:build

      - name: Deploy
        id: deploy_production
        working-directory: packages/neob-storybook
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/storybook-production.ndjson
        run: |
          : > "$WRANGLER_OUTPUT_FILE_PATH"
          bun run deploy
          deployment_url=$(jq -ser '
            map(select(.type == "deploy" and .worker_name == "neob-storybook" and .version_id != null))
            | last
            | [.targets[]? | select(. == "neob.joyful.tools (custom domain)") | "https://neob.joyful.tools"]
            | first
          ' "$WRANGLER_OUTPUT_FILE_PATH")
          echo "deployment-url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Add production summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy_production.outputs.deployment-url }}
        run: |
          echo "## Storybook Production" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production URL: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
